# ============================================
# AIChatHub Docker Compose 配置
# 一键启动: docker compose -f docker/docker-compose.yml up -d
# ============================================

services:
  # ---- Redis 数据库 ----
  redis:
    image: redis:7-alpine
    container_name: aichathub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aichathub-net

  # ---- FastAPI 后端 ----
  backend:
    build:
      context: ..
      dockerfile: ./backend/Dockerfile
    container_name: aichathub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # 配置文件路径（镜像内置）
      - CONFIG_PATH=/app/config/config.yaml
      # Redis 连接（指向 redis 容器）
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      # JWT 密钥
      - JWT_SECRET_KEY=aichathub-jwt-secret-k8x2mP9vQ4wR7yL1
    volumes:
      # 上传文件持久化
      - backend_uploads:/app/uploads
    networks:
      - aichathub-net

  # ---- Vue 前端 + Nginx ----
  frontend:
    build:
      context: ..
      dockerfile: ./frontend/Dockerfile
    container_name: aichathub-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - aichathub-net

volumes:
  redis_data:
  backend_uploads:

networks:
  aichathub-net:
    driver: bridge
