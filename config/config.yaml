# 全局配置文件
# 支持后端、前端和Docker Compose部署

# 应用基础配置
app:
  name: "Demo"
  version: "1.0.0"
  debug: false

# 后端服务配置
backend:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
  
  # 数据库配置
  database:
    type: "redis"
    host: "localhost"
    port: 6379
    db: 0
    password: null
  
  # JWT认证配置
  auth:
    secret_key: "your-secret-key-change-this-in-production"
    algorithm: "HS256"
    access_token_expire_minutes: 30

# 前端服务配置
frontend:
  host: "localhost"
  port: 5173
  api_base_url: "http://localhost:8000/api"

# 大语言模型配置 (OpenAI)
llm:
  # OpenAI配置
  openai:
    api_key: your api_key  # 从环境变量读取: OPENAI_API_KEY
    base_url: https://api.deepseek.com  # 可选，用于代理
    model: "deepseek-chat"
    temperature: 0.2
    max_tokens: 2048
  
  # 通用配置
  request_timeout: 60
  max_retries: 3

# Docker Compose配置
docker:
  # 服务名称
  services:
    backend:
      image: "demo-backend"
      container_name: "demo-backend"
      ports:
        - "8000:8000"
      environment:
        - "CONFIG_PATH=/app/config/config.yaml"
      volumes:
        - "./config:/app/config"
      depends_on:
        - redis
    
    frontend:
      image: "demo-frontend"
      container_name: "demo-frontend"
      ports:
        - "5173:5173"
      environment:
        - "VITE_API_BASE_URL=http://backend:8000/api"
    
    redis:
      image: "redis:7-alpine"
      container_name: "demo-redis"
      ports:
        - "6379:6379"
      volumes:
        - "redis_data:/data"
  
  volumes:
    redis_data:
