# AIChatHub 全局配置文件
# 后端运行时从该文件读取所有配置，也支持通过环境变量覆盖

# 应用基础配置
app:
  name: "PlanAskDemo"
  version: "1.0.0"
  debug: false

# 后端服务配置
backend:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5174"
    - "http://localhost:3000"

  # Redis 数据库配置
  database:
    host: "localhost"
    port: 6379
    db: 0
    password: null

  # JWT 认证配置
  auth:
    secret_key: "your-secret-key-change-this-in-production"  # 或环境变量 JWT_SECRET_KEY
    algorithm: "HS256"
    access_token_expire_minutes: 30

# 大语言模型配置
llm:
  openai:
    api_key: "your-api-key"              # 或环境变量 OPENAI_API_KEY
    base_url: "https://api.openai.com/v1"
    model: "gpt-3.5-turbo"
    temperature: 0.2
    max_tokens: 2048
  request_timeout: 60
  max_retries: 3

# 前端配置（构建时由 Vite 插件读取生成 config.json）
frontend:
  # Docker 部署时，前端通过 Nginx 代理 /api 到后端，使用相对同源地址
  # 本地开发时如需直连后端，改为完整地址如 http://localhost:8000/api/v1
  api_base_url: "/api/v1"
